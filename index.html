<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Kart Racer</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111827;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
        user-select: none;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #5ebf4f;
    }

    #hud {
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
        z-index: 5;
    }

    .panel {
        background: rgba(0,0,0,.72);
        border: 2px solid rgba(255,255,255,.2);
        border-radius: 12px;
        padding: 10px 14px;
        min-width: 145px;
        box-shadow: 0 5px 15px rgba(0,0,0,.25);
    }

    .title {
        font-size: 13px;
        color: #cbd5e1;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .value {
        font-size: 23px;
        font-weight: bold;
        margin-top: 2px;
    }

    #centerHud {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        pointer-events: none;
    }

    #position {
        font-size: 30px;
        font-weight: 900;
        text-shadow: 2px 2px 4px #000;
    }

    #lap {
        font-size: 15px;
        background: rgba(0,0,0,.65);
        border-radius: 20px;
        padding: 6px 13px;
        margin-top: 5px;
    }

    #itemBox {
        font-size: 32px;
        text-align: center;
    }

    #boostBar {
        width: 140px;
        height: 10px;
        background: #374151;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 6px;
    }

    #boostFill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg,#facc15,#fb923c,#ef4444);
        transition: width .1s;
    }

    #message {
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%,-50%);
        font-size: 64px;
        font-weight: 900;
        text-shadow: 4px 4px 0 #000;
        pointer-events: none;
        z-index: 10;
        text-align: center;
    }

    #startScreen,
    #finishScreen {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0,0,0,.72);
        z-index: 20;
    }

    .menu {
        width: min(90%, 520px);
        text-align: center;
        background: #1f2937;
        border: 3px solid #facc15;
        border-radius: 20px;
        padding: 35px;
        box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }

    .menu h1 {
        font-size: 46px;
        margin: 0 0 8px;
        color: #facc15;
        text-shadow: 3px 3px 0 #b45309;
    }

    .menu p {
        color: #d1d5db;
        line-height: 1.6;
    }

    button {
        border: none;
        border-radius: 12px;
        padding: 14px 28px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        background: #facc15;
        color: #111827;
        margin-top: 15px;
        transition: transform .15s, background .15s;
    }

    button:hover {
        transform: scale(1.05);
        background: #fde047;
    }

    #controls {
        margin-top: 20px;
        font-size: 14px;
        color: #9ca3af;
    }

    #mobileControls {
        display: none;
    }

    @media (max-width: 700px) {
        #hud {
            transform: scale(.85);
            transform-origin: top left;
            width: 118%;
        }

        #message {
            font-size: 42px;
        }

        #mobileControls {
            display: flex;
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            justify-content: space-between;
            z-index: 15;
            pointer-events: none;
        }

        .mobileSide {
            display: flex;
            gap: 10px;
        }

        .mobileBtn {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: rgba(0,0,0,.55);
            border: 2px solid rgba(255,255,255,.35);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            pointer-events: auto;
            touch-action: none;
        }

        .menu h1 {
            font-size: 34px;
        }
    }
</style>
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div class="panel">
            <div class="title">Speed</div>
            <div class="value"><span id="speed">0</span> km/h</div>
            <div id="boostBar">
                <div id="boostFill"></div>
            </div>
        </div>

        <div id="centerHud">
            <div id="position">1st</div>
            <div id="lap">Lap 1 / 3</div>
        </div>

        <div class="panel">
            <div class="title">Coins</div>
            <div class="value">🪙 <span id="coins">0</span></div>
            <div class="title" style="margin-top:7px">Item</div>
            <div id="itemBox">—</div>
        </div>

    </div>

    <div id="message"></div>

    <div id="mobileControls">
        <div class="mobileSide">
            <div class="mobileBtn" id="leftBtn">◀</div>
            <div class="mobileBtn" id="rightBtn">▶</div>
        </div>

        <div class="mobileSide">
            <div class="mobileBtn" id="driftBtn">D</div>
            <div class="mobileBtn" id="itemBtn">★</div>
        </div>
    </div>

    <div id="startScreen">
        <div class="menu">
            <h1>SUPER KART</h1>
            <p>
                Race around the circuit, collect coins, grab items,
                drift through corners and beat the rival karts.
            </p>

            <button id="startButton">START RACE</button>

            <div id="controls">
                <strong>Controls</strong><br><br>
                W / ↑ — Accelerate<br>
                S / ↓ — Brake / Reverse<br>
                A / ← — Steer left<br>
                D / → — Steer right<br>
                Space — Drift<br>
                E — Use item
            </div>
        </div>
    </div>

    <div id="finishScreen" style="display:none">
        <div class="menu">
            <h1 id="finishTitle">FINISH!</h1>
            <p id="finishText"></p>
            <button id="restartButton">RACE AGAIN</button>
        </div>
    </div>

</div>

<script>
"use strict";

/* =========================================================
   SUPER KART
   A completely self-contained canvas kart racing game.
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = 1;

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

/* -----------------------------
   UI
----------------------------- */

const speedEl = document.getElementById("speed");
const coinsEl = document.getElementById("coins");
const lapEl = document.getElementById("lap");
const positionEl = document.getElementById("position");
const itemBox = document.getElementById("itemBox");
const boostFill = document.getElementById("boostFill");
const messageEl = document.getElementById("message");

const startScreen = document.getElementById("startScreen");
const finishScreen = document.getElementById("finishScreen");
const finishTitle = document.getElementById("finishTitle");
const finishText = document.getElementById("finishText");

/* -----------------------------
   Input
----------------------------- */

const keys = {};

window.addEventListener("keydown", e => {
    if (
        ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)
    ) {
        e.preventDefault();
    }

    keys[e.key.toLowerCase()] = true;

    if (e.key.toLowerCase() === "e") {
        useItem();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

/* Mobile buttons */

function holdButton(id, key) {
    const el = document.getElementById(id);

    const start = e => {
        e.preventDefault();
        keys[key] = true;
    };

    const end = e => {
        e.preventDefault();
        keys[key] = false;
    };

    el.addEventListener("pointerdown", start);
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
    el.addEventListener("pointerleave", end);
}

holdButton("leftBtn", "arrowleft");
holdButton("rightBtn", "arrowright");
holdButton("driftBtn", " ");
document.getElementById("itemBtn").addEventListener("pointerdown", e => {
    e.preventDefault();
    useItem();
});

/* -----------------------------
   Track
----------------------------- */

const track = [];

const trackPoints = [
    {x:0.18,y:0.50},
    {x:0.21,y:0.28},
    {x:0.40,y:0.15},
    {x:0.64,y:0.17},
    {x:0.82,y:0.29},
    {x:0.85,y:0.52},
    {x:0.75,y:0.73},
    {x:0.52,y:0.83},
    {x:0.29,y:0.76},
    {x:0.16,y:0.62}
];

function buildTrack() {
    track.length = 0;

    const scale = Math.min(W,H);

    for (let i = 0; i < trackPoints.length; i++) {
        track.push({
            x: trackPoints[i].x * W,
            y: trackPoints[i].y * H
        });
    }

    return scale;
}

buildTrack();

/* -----------------------------
   Math
----------------------------- */

function dist(a,b) {
    return Math.hypot(a.x-b.x, a.y-b.y);
}

function lerp(a,b,t) {
    return a + (b-a)*t;
}

function pointOnTrack(t) {
    t = ((t % 1) + 1) % 1;

    const scaled = t * track.length;
    const i = Math.floor(scaled);
    const f = scaled - i;

    const a = track[i % track.length];
    const b = track[(i+1) % track.length];

    return {
        x: lerp(a.x,b.x,f),
        y: lerp(a.y,b.y,f)
    };
}

function tangentAt(t) {
    const a = pointOnTrack(t - 0.001);
    const b = pointOnTrack(t + 0.001);

    return Math.atan2(b.y-a.y,b.x-a.x);
}

function trackDistanceTo(point) {
    let best = Infinity;
    let bestT = 0;

    for (let i=0; i<track.length; i++) {

        const a = track[i];
        const b = track[(i+1)%track.length];

        const dx = b.x-a.x;
        const dy = b.y-a.y;

        const len2 = dx*dx+dy*dy;

        let t = ((point.x-a.x)*dx+(point.y-a.y)*dy)/len2;
        t = Math.max(0,Math.min(1,t));

        const px = a.x+dx*t;
        const py = a.y+dy*t;

        const d = Math.hypot(point.x-px,point.y-py);

        if (d < best) {
            best = d;
            bestT = (i+t)/track.length;
        }
    }

    return {distance:best,t:bestT};
}

/* -----------------------------
   Game state
----------------------------- */

let running = false;
let countdown = 0;
let raceTime = 0;
let lastTime = 0;

const TOTAL_LAPS = 3;

let player;
let opponents = [];
let coins = [];
let items = [];
let particles = [];
let skidMarks = [];

function createPlayer() {

    const startT = 0.02;
    const p = pointOnTrack(startT);
    const angle = tangentAt(startT);

    return {
        x:p.x,
        y:p.y,
        angle:angle,
        speed:0,
        maxSpeed:6.8,
        acceleration:.15,
        braking:.18,
        friction:.035,
        turnSpeed:.045,
        drift:false,
        driftCharge:0,
        boost:0,
        coins:0,
        item:null,
        progress:startT,
        lastProgress:startT,
        lap:1,
        finished:false,
        hitTimer:0,
        invincible:0
    };
}

function createOpponent(index) {

    const t = 0.94 - index * 0.025;
    const p = pointOnTrack(t);

    return {
        x:p.x,
        y:p.y,
        angle:tangentAt(t),
        speed:4.7 + Math.random()*0.7,
        progress:t,
        lap:1,
        color:["#ef4444","#3b82f6","#a855f7","#f97316","#14b8a6","#e11d48"][index],
        wobble:Math.random()*100,
        skill:.92 + Math.random()*.13,
        finished:false
    };
}

function resetRace() {

    player = createPlayer();

    opponents = [];

    for (let i=0;i<6;i++) {
        opponents.push(createOpponent(i));
    }

    coins = [];
    items = [];
    particles = [];
    skidMarks = [];

    createCollectibles();

    raceTime = 0;
    countdown = 3;
    running = true;

    messageEl.textContent = "3";
}

/* -----------------------------
   Collectibles
----------------------------- */

function createCollectibles() {

    for (let i=0;i<28;i++) {

        const t = (0.035 + i/28 * .94) % 1;
        const p = pointOnTrack(t);

        coins.push({
            x:p.x,
            y:p.y,
            collected:false,
            spin:Math.random()*Math.PI*2
        });
    }

    for (let i=0;i<10;i++) {

        const t = (0.09 + i/10 * .9) % 1;
        const p = pointOnTrack(t);

        items.push({
            x:p.x,
            y:p.y,
            collected:false,
            pulse:Math.random()*Math.PI*2
        });
    }
}

/* -----------------------------
   Player update
----------------------------- */

function updatePlayer(dt) {

    if (countdown > 0) {
        return;
    }

    const accelerating =
        keys["w"] || keys["arrowup"];

    const braking =
        keys["s"] || keys["arrowdown"];

    const left =
        keys["a"] || keys["arrowleft"];

    const right =
        keys["d"] || keys["arrowright"];

    const drifting = keys[" "];

    if (accelerating) {
        player.speed += player.acceleration;
    }

    if (braking) {
        player.speed -= player.braking;
    }

    if (!accelerating && !braking) {
        if (player.speed > 0) {
            player.speed -= player.friction;
        } else if (player.speed < 0) {
            player.speed += player.friction;
        }
    }

    player.speed = Math.max(-2.2,Math.min(player.maxSpeed,player.speed));

    const steering =
        (left ? -1 : 0) +
        (right ? 1 : 0);

    const speedFactor =
        Math.min(Math.abs(player.speed)/4,1);

    if (steering !== 0) {

        const turn =
            player.turnSpeed *
            speedFactor *
            (drifting ? 1.45 : 1);

        player.angle += steering * turn;

        if (drifting && Math.abs(player.speed) > 2) {
            player.driftCharge += .8;

            if (Math.random() < .45) {
                skidMarks.push({
                    x:player.x,
                    y:player.y,
                    life:1
                });
            }
        }

    } else if (drifting) {

        player.driftCharge += .4;
    }

    if (!drifting && player.driftCharge > 0) {

        if (player.driftCharge > 70) {
            player.boost = Math.min(100,player.boost+55);
        } else if (player.driftCharge > 35) {
            player.boost = Math.min(100,player.boost+28);
        }

        player.driftCharge = 0;
    }

    if (player.boost > 0 && keys["shift"]) {
        player.speed += .20;
        player.boost -= .8;
    }

    const currentTrack = trackDistanceTo(player);

    if (currentTrack.distance > Math.min(W,H)*.105) {
        player.speed *= .91;
    }

    player.x += Math.cos(player.angle) * player.speed * 2.4;
    player.y += Math.sin(player.angle) * player.speed * 2.4;

    player.x = Math.max(-40,Math.min(W+40,player.x));
    player.y = Math.max(-40,Math.min(H+40,player.y));

    updateProgress();

    collectObjects();

    if (player.hitTimer > 0) {
        player.hitTimer -= dt;
    }

    if (player.invincible > 0) {
        player.invincible -= dt;
    }
}

/* -----------------------------
   Progress / laps
----------------------------- */

function updateProgress() {

    const info = trackDistanceTo(player);

    let newProgress = info.t;

    if (
        player.lastProgress > .80 &&
        newProgress < .20 &&
        player.speed > 0
    ) {
        player.lap++;

        if (player.lap > TOTAL_LAPS) {
            player.finished = true;
            finishRace();
        }
    }

    player.progress = newProgress;
    player.lastProgress = newProgress;
}

/* -----------------------------
   AI
----------------------------- */

function updateOpponents(dt) {

    if (countdown > 0) return;

    opponents.forEach((car,index) => {

        if (car.finished) return;

        const targetT =
            (car.progress + .0015 * car.skill) % 1;

        const target = pointOnTrack(targetT);

        const targetAngle = tangentAt(targetT);

        let diff = targetAngle-car.angle;

        while(diff > Math.PI) diff -= Math.PI*2;
        while(diff < -Math.PI) diff += Math.PI*2;

        car.angle += diff * .08;

        const idealSpeed =
            4.4 + Math.sin(raceTime*.5+car.wobble)*.35;

        car.speed +=
            (idealSpeed-car.speed)*.03;

        car.x += Math.cos(car.angle)*car.speed*2.4;
        car.y += Math.sin(car.angle)*car.speed*2.4;

        const info = trackDistanceTo(car);

        if (
            car.progress > .80 &&
            info.t < .20
        ) {
            car.lap++;

            if (car.lap > TOTAL_LAPS) {
                car.finished = true;
            }
        }

        car.progress = info.t;
    });
}

/* -----------------------------
   Items / collisions
----------------------------- */

function collectObjects() {

    coins.forEach(c => {

        if (c.collected) return;

        if (Math.hypot(player.x-c.x,player.y-c.y) < 24) {

            c.collected = true;

            player.coins =
                Math.min(10,player.coins+1);

            player.maxSpeed =
                6.8 + player.coins*.08;

            spawnParticles(c.x,c.y,"coin");
        }
    });

    items.forEach(it => {

        if (it.collected) return;

        if (Math.hypot(player.x-it.x,player.y-it.y) < 28) {

            it.collected = true;

            const possible = [
                "🍄",
                "⚡",
                "💣",
                "⭐"
            ];

            player.item =
                possible[Math.floor(Math.random()*possible.length)];

            spawnParticles(it.x,it.y,"item");
        }
    });
}

function useItem() {

    if (!running || countdown > 0 || !player.item) {
        return;
    }

    const item = player.item;
    player.item = null;

    if (item === "🍄") {

        player.boost = Math.min(
            100,
            player.boost+75
        );

        player.speed = Math.min(
            player.maxSpeed+2,
            player.speed+2
        );

        spawnParticles(player.x,player.y,"boost");
    }

    else if (item === "⚡") {

        opponents.forEach(car => {
            car.speed *= .55;
        });

        spawnParticles(player.x,player.y,"lightning");
    }

    else if (item === "💣") {

        opponents.forEach(car => {

            const d =
                Math.hypot(
                    player.x-car.x,
                    player.y-car.y
                );

            if (d < 170) {
                car.speed *= .3;
            }
        });

        spawnParticles(player.x,player.y,"explosion");
    }

    else if (item === "⭐") {

        player.invincible = 5;
        player.speed += 1.5;

        spawnParticles(player.x,player.y,"star");
    }
}

/* -----------------------------
   Particles
----------------------------- */

function spawnParticles(x,y,type) {

    for (let i=0;i<22;i++) {

        const angle =
            Math.random()*Math.PI*2;

        const speed =
            1+Math.random()*4;

        particles.push({
            x,
            y,
            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,
            life:1,
            type
        });
    }
}

function updateParticles(dt) {

    particles.forEach(p => {

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= .97;
        p.vy *= .97;

        p.life -= .025;
    });

    particles =
        particles.filter(p => p.life > 0);

    skidMarks.forEach(s => {
        s.life -= .015;
    });

    skidMarks =
        skidMarks.filter(s => s.life > 0);
}

/* -----------------------------
   Race position
----------------------------- */

function getPlayerPosition() {

    const racers = [
        {
            progress:
                (player.lap-1)+player.progress,
            player:true
        }
    ];

    opponents.forEach(o => {

        racers.push({
            progress:
                (o.lap-1)+o.progress,
            player:false
        });
    });

    racers.sort((a,b)=>b.progress-a.progress);

    return racers.findIndex(r=>r.player)+1;
}

/* -----------------------------
   Drawing
----------------------------- */

function drawBackground() {

    ctx.fillStyle = "#5dbb4f";
    ctx.fillRect(0,0,W,H);

    /* grass pattern */

    ctx.strokeStyle = "rgba(0,0,0,.05)";
    ctx.lineWidth = 2;

    for(let x=0;x<W;x+=35) {

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x+100,H);
        ctx.stroke();
    }
}

function drawTrack() {

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    /* Outer road */

    ctx.beginPath();

    track.forEach((p,i)=>{
        if(i===0) ctx.moveTo(p.x,p.y);
        else ctx.lineTo(p.x,p.y);
    });

    ctx.closePath();

    ctx.lineWidth = Math.min(W,H)*.19;
    ctx.strokeStyle = "#d1d5db";
    ctx.stroke();

    /* Kerb */

    ctx.lineWidth = Math.min(W,H)*.175;
    ctx.strokeStyle = "#ef4444";
    ctx.stroke();

    /* White kerb */

    ctx.setLineDash([18,18]);
    ctx.lineWidth = Math.min(W,H)*.16;
    ctx.strokeStyle = "#f8fafc";
    ctx.stroke();
    ctx.setLineDash([]);

    /* Road */

    ctx.lineWidth = Math.min(W,H)*.145;
    ctx.strokeStyle = "#374151";
    ctx.stroke();

    /* Road center markings */

    ctx.setLineDash([30,35]);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255,255,255,.25)";
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawStartLine() {

    const p = pointOnTrack(.02);
    const angle = tangentAt(.02);

    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(angle);

    const width = Math.min(W,H)*.16;

    for(let i=-5;i<5;i++) {

        ctx.fillStyle =
            i%2===0 ? "#fff" : "#111";

        ctx.fillRect(
            -10,
            i*width/10,
            20,
            width/10
        );
    }

    ctx.restore();
}

function drawCoins() {

    coins.forEach(c => {

        if(c.collected) return;

        c.spin += .08;

        const scale =
            Math.abs(Math.cos(c.spin))*.5+.5;

        ctx.save();
        ctx.translate(c.x,c.y);
        ctx.scale(scale,1);

        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.arc(0,0,10,0,Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = "#b45309";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#fff7a8";
        ctx.font = "bold 11px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("C",0,0);

        ctx.restore();
    });
}

function drawItems() {

    items.forEach(it => {

        if(it.collected) return;

        it.pulse += .07;

        const s =
            1 + Math.sin(it.pulse)*.08;

        ctx.save();
        ctx.translate(it.x,it.y);
        ctx.scale(s,s);

        ctx.fillStyle = "#8b5cf6";

        ctx.beginPath();
        ctx.arc(0,0,14,0,Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.font = "bold 17px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("?",0,1);

        ctx.restore();
    });
}

function drawSkidMarks() {

    skidMarks.forEach(s => {

        ctx.globalAlpha = s.life*.3;
        ctx.fillStyle = "#111";

        ctx.beginPath();
        ctx.arc(s.x,s.y,3,0,Math.PI*2);
        ctx.fill();
    });

    ctx.globalAlpha = 1;
}

function drawKart(car,isPlayer=false) {

    ctx.save();

    ctx.translate(car.x,car.y);
    ctx.rotate(car.angle);

    if (
        isPlayer &&
        player.invincible > 0
    ) {
        ctx.globalAlpha =
            .5 + Math.sin(Date.now()*.02)*.4;
    }

    /* shadow */

    ctx.fillStyle = "rgba(0,0,0,.3)";
    ctx.beginPath();
    ctx.ellipse(0,5,22,12,0,0,Math.PI*2);
    ctx.fill();

    /* wheels */

    ctx.fillStyle = "#111";

    ctx.fillRect(-15,-15,8,13);
    ctx.fillRect(7,-15,8,13);
    ctx.fillRect(-15,2,8,13);
    ctx.fillRect(7,2,8,13);

    /* body */

    ctx.fillStyle =
        isPlayer ? "#22c55e" : car.color;

    ctx.beginPath();
    ctx.roundRect(-17,-12,34,24,7);
    ctx.fill();

    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 2;
    ctx.stroke();

    /* seat */

    ctx.fillStyle = "#111827";
    ctx.beginPath();
    ctx.ellipse(-2,0,8,8,0,0,Math.PI*2);
    ctx.fill();

    /* front */

    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(10,-6,4,12);

    /* headlights */

    ctx.fillStyle = "#fde68a";
    ctx.fillRect(14,-7,3,4);
    ctx.fillRect(14,3,3,4);

    ctx.restore();
}

function drawParticles() {

    particles.forEach(p => {

        ctx.globalAlpha = Math.max(0,p.life);

        let size = 5;

        if(p.type === "coin") {
            ctx.fillStyle = "#facc15";
        }
        else if(p.type === "item") {
            ctx.fillStyle = "#c084fc";
        }
        else if(p.type === "boost") {
            ctx.fillStyle = "#fb923c";
            size = 7;
        }
        else if(p.type === "lightning") {
            ctx.fillStyle = "#fde047";
            size = 6;
        }
        else if(p.type === "explosion") {
            ctx.fillStyle = "#ef4444";
            size = 8;
        }
        else {
            ctx.fillStyle = "#facc15";
            size = 6;
        }

        ctx.beginPath();
        ctx.arc(p.x,p.y,size*p.life,0,Math.PI*2);
        ctx.fill();
    });

    ctx.globalAlpha = 1;
}

/* -----------------------------
   Render
----------------------------- */

function render() {

    drawBackground();
    drawTrack();
    drawStartLine();
    drawSkidMarks();
    drawCoins();
    drawItems();

    opponents
        .slice()
        .sort((a,b)=>a.y-b.y)
        .forEach(car=>drawKart(car,false));

    drawKart(player,true);

    drawParticles();

    /* Speed lines */

    if (Math.abs(player.speed)>5.8) {

        ctx.strokeStyle = "rgba(255,255,255,.18)";
        ctx.lineWidth = 2;

        for(let i=0;i<8;i++) {

            const x =
                Math.random()*W;

            const y =
                Math.random()*H;

            ctx.beginPath();
            ctx.moveTo(x,y);
            ctx.lineTo(
                x-Math.cos(player.angle)*25,
                y-Math.sin(player.angle)*25
            );
            ctx.stroke();
        }
    }
}

/* -----------------------------
   HUD
----------------------------- */

function updateHUD() {

    speedEl.textContent =
        Math.round(Math.max(0,player.speed)*38);

    coinsEl.textContent =
        player.coins;

    lapEl.textContent =
        `Lap ${Math.min(player.lap,TOTAL_LAPS)} / ${TOTAL_LAPS}`;

    const position =
        getPlayerPosition();

    const suffix =
        position===1 ? "st" :
        position===2 ? "nd" :
        position===3 ? "rd" : "th";

    positionEl.textContent =
        `${position}${suffix}`;

    itemBox.textContent =
        player.item || "—";

    boostFill.style.width =
        `${Math.max(0,Math.min(100,player.boost))}%`;
}

/* -----------------------------
   Countdown
----------------------------- */

function updateCountdown(dt) {

    if(countdown <= 0) return;

    countdown -= dt;

    if(countdown > 2) {
        messageEl.textContent = "3";
    }
    else if(countdown > 1) {
        messageEl.textContent = "2";
    }
    else if(countdown > 0) {
        messageEl.textContent = "1";
    }
    else {
        messageEl.textContent = "GO!";

        setTimeout(()=>{
            if(running) {
                messageEl.textContent = "";
            }
        },700);
    }
}

/* -----------------------------
   Finish
----------------------------- */

function finishRace() {

    if(!running) return;

    running = false;

    const position =
        getPlayerPosition();

    finishTitle.textContent =
        position === 1 ? "🏆 VICTORY!" : "FINISH!";

    finishText.innerHTML =
        `You finished <strong>${position}${position===1?"st":position===2?"nd":position===3?"rd":"th"}</strong>!<br><br>
         Coins collected: ${player.coins}<br>
         Race time: ${raceTime.toFixed(1)} seconds`;

    finishScreen.style.display = "flex";
}

/* -----------------------------
   Main loop
----------------------------- */

function gameLoop(timestamp) {

    if(!lastTime) {
        lastTime = timestamp;
    }

    let dt =
        Math.min((timestamp-lastTime)/1000,.033);

    lastTime = timestamp;

    if(running) {

        raceTime += dt;

        updateCountdown(dt);

        updatePlayer(dt);
        updateOpponents(dt);
        updateParticles(dt);

        updateHUD();
    }

    render();

    requestAnimationFrame(gameLoop);
}

/* -----------------------------
   Start / restart
----------------------------- */

document.getElementById("startButton")
    .addEventListener("click",()=>{

        startScreen.style.display = "none";
        finishScreen.style.display = "none";

        resetRace();
    });

document.getElementById("restartButton")
    .addEventListener("click",()=>{

        finishScreen.style.display = "none";

        resetRace();
    });

/* Start rendering */

player = createPlayer();
opponents = [];

for(let i=0;i<6;i++) {
    opponents.push(createOpponent(i));
}

createCollectibles();
updateHUD();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
